<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">

  <title>AXM SERVICE</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }

    body{
      background:#080808;
      color:#fff;
      min-height:100vh;
    }

    .hidden{display:none!important;}

    .login{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:25px;
      background:
        radial-gradient(circle at top,#351010 0,#080808 45%);
    }

    .login-box{
      width:100%;
      max-width:420px;
      background:#111;
      border:1px solid #292929;
      border-radius:24px;
      padding:30px 22px;
      box-shadow:0 20px 60px #000;
    }

    .logo{
      text-align:center;
      margin-bottom:30px;
    }

    .logo-mark{
      width:80px;
      height:80px;
      margin:auto;
      border-radius:22px;
      background:#d71920;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:900;
      box-shadow:0 0 30px rgba(215,25,32,.25);
    }

    .logo h1{
      margin-top:15px;
      font-size:28px;
    }

    .logo p{
      color:#888;
      margin-top:6px;
    }

    input,select,textarea{
      width:100%;
      background:#181818;
      color:#fff;
      border:1px solid #333;
      border-radius:13px;
      padding:15px;
      margin:7px 0;
      outline:none;
      font-size:16px;
    }

    input:focus,textarea:focus{
      border-color:#d71920;
    }

    button{
      border:0;
      cursor:pointer;
    }

    .primary{
      width:100%;
      background:#d71920;
      color:white;
      border-radius:13px;
      padding:15px;
      margin-top:12px;
      font-weight:700;
      font-size:16px;
    }

    #loginMessage{
      color:#ff6868;
      text-align:center;
      margin-top:15px;
      min-height:20px;
    }

    header{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(8,8,8,.96);
      border-bottom:1px solid #252525;
      padding:15px 17px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .brand{
      font-size:20px;
      font-weight:900;
    }

    .brand span{
      color:#d71920;
    }

    .logout{
      background:#1d1d1d;
      color:#aaa;
      padding:9px 12px;
      border-radius:10px;
    }

    main{
      padding:18px;
      max-width:800px;
      margin:auto;
      padding-bottom:100px;
    }

    .welcome{
      margin-bottom:20px;
    }

    .welcome h2{
      font-size:25px;
    }

    .welcome p{
      color:#777;
      margin-top:5px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      margin-bottom:20px;
    }

    .stat{
      background:#121212;
      border:1px solid #252525;
      border-radius:18px;
      padding:18px;
    }

    .stat small{
      color:#888;
    }

    .stat strong{
      display:block;
      font-size:25px;
      margin-top:8px;
    }

    .red{
      color:#ef333a;
    }

    .menu{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }

    .card{
      background:#121212;
      border:1px solid #262626;
      min-height:135px;
      border-radius:19px;
      padding:20px 15px;
      color:white;
      text-align:left;
      transition:.2s;
    }

    .card:active{
      transform:scale(.97);
      border-color:#d71920;
    }

    .icon{
      font-size:29px;
      margin-bottom:16px;
      display:block;
    }

    .card strong{
      display:block;
      font-size:17px;
    }

    .card small{
      color:#777;
      display:block;
      margin-top:5px;
    }

    .section{
      margin-top:25px;
      background:#111;
      border:1px solid #242424;
      border-radius:18px;
      padding:18px;
    }

    .section h3{
      margin-bottom:15px;
    }

    .service-item{
      background:#181818;
      padding:15px;
      border-radius:13px;
      margin-top:10px;
      border-left:4px solid #d71920;
    }

    .service-item small{
      color:#888;
      display:block;
      margin-top:5px;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.85);
      z-index:50;
      display:flex;
      justify-content:center;
      align-items:flex-end;
    }

    .modal-box{
      background:#111;
      border-radius:25px 25px 0 0;
      padding:22px;
      width:100%;
      max-width:700px;
      max-height:90vh;
      overflow:auto;
      border-top:1px solid #333;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
    }

    .close{
      background:#252525;
      color:white;
      width:38px;
      height:38px;
      border-radius:50%;
      font-size:20px;
    }

    .footer{
      text-align:center;
      color:#555;
      margin-top:35px;
      font-size:12px;
    }

    @media(min-width:700px){
      .stats{grid-template-columns:repeat(4,1fr);}
      .menu{grid-template-columns:repeat(3,1fr);}
    }
  </style>
</head>

<body>

<div id="loginPage" class="login">

  <div class="login-box">

    <div class="logo">
      <div class="logo-mark">AXM</div>
      <h1>AXM SERVICE</h1>
      <p>Servis İdarəetmə Sistemi</p>
    </div>

    <input id="email" type="email" placeholder="Email">

    <input id="password" type="password" placeholder="Şifrə">

    <button class="primary" onclick="login()">
      Daxil ol
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<div id="app" class="hidden">

<header>

  <div class="brand">
    AXM <span>SERVICE</span>
  </div>

  <button class="logout" onclick="logout()">
    Çıxış
  </button>

</header>


<main>

  <div class="welcome">
    <h2>İdarəetmə paneli</h2>
    <p>AXM Group • Servis sistemi</p>
  </div>


  <div class="stats">

    <div class="stat">
      <small>Aktiv işlər</small>
      <strong id="activeJobs">0</strong>
    </div>

    <div class="stat">
      <small>Müştərilər</small>
      <strong id="customerCount">0</strong>
    </div>

    <div class="stat">
      <small>Bu gün</small>
      <strong id="todayJobs">0</strong>
    </div>

    <div class="stat">
      <small>Gəlir</small>
      <strong class="red" id="income">0 ₼</strong>
    </div>

  </div>


  <div class="menu">

    <button class="card" onclick="openNewOrder()">
      <span class="icon">🔧</span>
      <strong>Yeni iş</strong>
      <small>Avtomobil qəbul et</small>
    </button>

    <button class="card" onclick="opencars()">
      <span class="icon">🚘</span>
      <strong>Avtomobillər</strong>
      <small>Servis tarixçəsi</small>
    </button>

    <button class="card">
      <span class="icon">👤</span>
      <strong>Müştərilər</strong>
      <small>Müştəri bazası</small>
    </button>

    <button class="card">
      <span class="icon">📋</span>
      <strong>İş sifarişləri</strong>
      <small>Aktiv və tamamlanan</small>
    </button>

    <button class="card">
      <span class="icon">📦</span>
      <strong>Ehtiyat hissələri</strong>
      <small>Hissə və materiallar</small>
    </button>

    <button class="card">
      <span class="icon">🛡️</span>
      <strong>Zəmanət</strong>
      <small>Zəmanətli təmirlər</small>
    </button>

    <button class="card">
      <span class="icon">💰</span>
      <strong>Maliyyə</strong>
      <small>Gəlir və xərclər</small>
    </button>

    <button class="card">
      <span class="icon">🏢</span>
      <strong>Şirkətlər</strong>
      <small>Korporativ müştərilər</small>
    </button>

    <button class="card">
      <span class="icon">📊</span>
      <strong>Hesabatlar</strong>
      <small>Servis statistikası</small>
    </button>

  </div>


  <div class="section">

    <h3>Son işlər</h3>

    <div id="orders">
      <div style="color:#666">
        Hələ iş sifarişi yoxdur.
      </div>
    </div>

  </div>

  <div class="footer">
    AXM GROUP © 2026
  </div>

</main>

</div>


<div id="orderModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">
      <h2>Yeni servis qəbulu</h2>

      <button class="close" onclick="closeModal()">
        ×
      </button>
    </div>

    <input id="customerName" placeholder="Müştərinin adı">

    <input id="customerPhone" type="tel" placeholder="Telefon">

    <input id="carBrand" placeholder="Marka — məsələn BMW">

    <input id="carModel" placeholder="Model">

    <input id="carPlate" placeholder="Dövlət nömrəsi">

    <input id="carVin" placeholder="VIN">

    <input id="mileage" type="number" placeholder="Yürüş (km)">

    <textarea
      id="problem"
      rows="4"
      placeholder="Müştərinin şikayəti / görüləcək iş">
    </textarea>

    <input
      id="estimatedPrice"
      type="number"
      placeholder="Təxmini qiymət ₼">

    <button class="primary" onclick="saveOrder()">
      Servis qəbulunu yadda saxla
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://tliwcgvyqgzusbnlitsp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AZD7uVAwy4LNgWLcQYCEQw_pJIOJazE";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.innerText = "Giriş edilir...";

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    message.innerText =
      "Giriş alınmadı: " + error.message;
    return;
  }

  message.innerText = "";

  showApp();
}


async function logout(){

  await db.auth.signOut();

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");
}


function showApp(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  loadOrders();
}


function openNewOrder(){

  document
    .getElementById("orderModal")
    .classList.remove("hidden");
}


function closeModal(){

  document
    .getElementById("orderModal")
    .classList.add("hidden");
}


async function saveOrder(){

  const customer =
    document.getElementById("customerName").value;

  const phone =
    document.getElementById("customerPhone").value;

  const brand =
    document.getElementById("carBrand").value;

  const model =
    document.getElementById("carModel").value;

  const plate =
    document.getElementById("carPlate").value;

  const vin =
    document.getElementById("carVin").value;

  const mileage =
    document.getElementById("mileage").value;

  const problem =
    document.getElementById("problem").value;

  const price =
    document.getElementById("estimatedPrice").value;

  /*
    Növbəti mərhələdə bu hissəni
    Supabase-də yaratdığımız
    customers / vehicles / work_orders
    cədvəllərinə tam bağlayacağıq.
  */

  const container =
    document.getElementById("orders");

  container.innerHTML = `
    <div class="service-item">

      <strong>
        ${brand || "Avtomobil"}
        ${model || ""}
      </strong>

      <small>
        ${plate || "Nömrə yoxdur"}
      </small>

      <small>
        Müştəri:
        ${customer || "Qeyd edilməyib"}
      </small>

      <small>
        ${problem || "İş qeyd edilməyib"}
      </small>

      <small>
        ${price ? price + " ₼" : ""}
      </small>

    </div>
  ` + container.innerHTML;

  closeModal();

  alert("Servis qəbulu əlavə edildi.");
}


async function loadOrders(){

  /*
    Bazadan sifarişləri oxuma hissəsini
    növbəti mərhələdə aktivləşdirəcəyik.
  */

}


async function checkSession(){

  const {
    data:{session}
  } = await db.auth.getSession();

  if(session){
    showApp();
  }

}

checkSession();

</script>

</body>
</html>
