<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AXM Group Service</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#071017;color:#fff;font-family:Arial,sans-serif}
.stage{position:relative;width:100%;max-width:1536px;aspect-ratio:3/2;margin:auto;background:#071017;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:8px}
.hot:hover{outline:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.025)}
#home{left:.8%;top:13.1%;width:13.7%;height:5.3%}
#newjob{left:85.3%;top:14.7%;width:13.2%;height:6.2%}
#newjob2{left:1.1%;top:19.1%;width:12.8%;height:4.4%}
#cars{left:1.1%;top:24.3%;width:12.8%;height:4.5%}
#customers{left:1.1%;top:29.5%;width:12.8%;height:4.4%}
#orders{left:1.1%;top:34.7%;width:12.8%;height:4.4%}
#parts{left:1.1%;top:39.9%;width:12.8%;height:4.4%}
#warehouse{left:1.1%;top:45.2%;width:12.8%;height:4.4%}
#finance{left:1.1%;top:50.4%;width:12.8%;height:4.4%}
#masters{left:1.1%;top:55.7%;width:12.8%;height:4.4%}
#warranty{left:1.1%;top:60.9%;width:12.8%;height:4.4%}
#reports{left:1.1%;top:66.2%;width:12.8%;height:4.4%}
#calendar{left:1.1%;top:71.4%;width:12.8%;height:4.4%}
#messages{left:1.1%;top:76.7%;width:12.8%;height:4.4%}
#settings{left:1.1%;top:81.9%;width:12.8%;height:4.4%}
.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:20px;z-index:10}
.modal.open{display:grid}.box{width:min(700px,100%);background:#101a21;border:1px solid #344550;border-radius:13px;padding:20px;box-shadow:0 30px 80px #000}
.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0 0 16px}.x{border:0;background:none;color:#fff;font-size:28px;cursor:pointer}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form select,.form textarea{background:#091117;color:#fff;border:1px solid #344650;border-radius:7px;padding:12px}.form textarea{grid-column:1/-1;min-height:90px}.save{grid-column:1/-1;border:0;border-radius:7px;background:#e51f2a;color:#fff;padding:13px;font-weight:700;cursor:pointer}
.toast{position:fixed;right:18px;bottom:18px;background:#121d24;border:1px solid #31434e;padding:13px 16px;border-radius:9px;display:none;z-index:20}
@media(max-width:700px){.stage{width:1536px;height:1024px;transform-origin:top left}.scroll{overflow:auto;width:100vw;height:100vh}.form{grid-template-columns:1fr}.form textarea,.save{grid-column:auto}}
</style>
</head>
<body>
<div class="scroll"><div class="stage">
<img class="bg" src="axm-dashboard.png" alt="AXM Group Service dashboard">
<button class="hot" id="home" aria-label="Ana səhifə"></button>
<button class="hot" id="newjob" aria-label="Yeni iş qəbulu"></button><button class="hot" id="newjob2" aria-label="Yeni iş qəbulu"></button>
<button class="hot" id="cars" aria-label="Avtomobillər"></button><button class="hot" id="customers" aria-label="Müştərilər"></button>
<button class="hot" id="orders" aria-label="İş sifarişləri"></button><button class="hot" id="parts" aria-label="Ehtiyat hissələri"></button>
<button class="hot" id="warehouse" aria-label="Anbar"></button><button class="hot" id="finance" aria-label="Maliyyə"></button>
<button class="hot" id="masters" aria-label="Ustalar"></button><button class="hot" id="warranty" aria-label="Zəmanət"></button>
<button class="hot" id="reports" aria-label="Hesabatlar"></button><button class="hot" id="calendar" aria-label="Təqvim"></button>
<button class="hot" id="messages" aria-label="Mesajlar"></button><button class="hot" id="settings" aria-label="Tənzimləmələr"></button>
</div></div>

<div id="modal" class="modal"><div class="box">
<div class="head"><h2>Yeni İş Qəbulu</h2><button class="x" onclick="closeModal()">×</button></div>
<div class="form">
<input id="name" placeholder="Müştərinin adı"><input id="phone" placeholder="Telefon">
<input id="car" placeholder="Avtomobil"><input id="plate" placeholder="Dövlət nömrəsi">
<input id="vin" placeholder="VIN"><input id="km" type="number" placeholder="Yürüş / km">
<textarea id="work" placeholder="Şikayət / görüləcək iş"></textarea>
<input id="price" type="number" placeholder="Məbləğ AZN">
<select id="status"><option>Təmirdə</option><option>Diaqnostika</option><option>Hazır</option><option>Təhvil verildi</option></select>
<button class="save" onclick="save()">Yadda saxla</button>
</div></div></div>
<div id="toast" class="toast"></div>
<script>
const modal=document.getElementById('modal'), toast=document.getElementById('toast');
function openModal(){modal.classList.add('open')} function closeModal(){modal.classList.remove('open')}
newjob.onclick=openModal;newjob2.onclick=openModal;
modal.onclick=e=>{if(e.target===modal)closeModal()}
function note(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}
function save(){
 const data={name:name.value,phone:phone.value,car:car.value,plate:plate.value,vin:vin.value,km:km.value,work:work.value,price:price.value,status:status.value,date:new Date().toISOString()};
 if(!data.name||!data.car||!data.plate){alert('Müştəri, avtomobil və dövlət nömrəsini doldur.');return}
 const a=JSON.parse(localStorage.getItem('axm_jobs')||'[]');a.unshift(data);localStorage.setItem('axm_jobs',JSON.stringify(a));closeModal();note('Yeni iş yadda saxlanıldı');
}
const labels={home:'Ana səhifə',cars:'Avtomobillər',customers:'Müştərilər',orders:'İş Sifarişləri',parts:'Ehtiyat Hissələri',warehouse:'Anbar',finance:'Maliyyə',masters:'Ustalar',warranty:'Zəmanət',reports:'Hesabatlar',calendar:'Təqvim',messages:'Mesajlar',settings:'Tənzimləmələr'};
Object.entries(labels).forEach(([id,label])=>document.getElementById(id).onclick=()=>note(label+' bölməsi — funksional səhifə növbəti mərhələdə bağlanacaq'));
</script>
</body></html>
